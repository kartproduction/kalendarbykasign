<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get the Kalendar app — Android download</title>
<meta name="description" content="Kalendar by Kasign is now available for Android. Free download, works offline, no account.">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#f6f4f0;--sf:#fff;--tx:#1f1d1a;--mu:#6f695f;--ac:#b5562b;--ac2:#8f3f1b;--bd:#e7e0d5}
@media(prefers-color-scheme:dark){:root{--bg:#141210;--sf:#1d1a17;--tx:#f2eee8;--mu:#a69e92;--ac:#e08a5c;--ac2:#f0a982;--bd:#38332d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:26px 16px 40px}
.pg{width:100%;max-width:520px;background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:34px 24px 30px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:12px;font:700 34px Georgia,serif;text-decoration:none;color:var(--tx)}
.logo img{width:54px;height:54px;border-radius:14px}
.ph{width:250px;height:500px;margin:34px auto 30px;border-radius:38px;background:#e9e4dc;padding:9px;box-shadow:0 18px 40px rgba(60,40,20,.2);position:relative}
@media(prefers-color-scheme:dark){.ph{background:#34302b}}
.ph::before{content:"";position:absolute;top:9px;left:50%;width:84px;height:18px;margin-left:-42px;border-radius:0 0 12px 12px;background:#e9e4dc;z-index:2}
@media(prefers-color-scheme:dark){.ph::before{background:#34302b}}
.sc{height:100%;border-radius:30px;overflow:hidden;background:#fbf8f2;color:#26324f;display:flex;flex-direction:column}
.art{height:41%;flex:none}.art svg{display:block;width:100%;height:100%}
.pn{padding:12px 16px;flex:1;text-align:left}
.pn b{display:block;font:600 24px Georgia,serif}.pn small{color:#c26a3d;font-size:11px;letter-spacing:.06em}
.g{display:grid;grid-template-columns:repeat(7,1fr);margin-top:8px;font-size:11px;text-align:center;row-gap:3px}
.g i{font-style:normal;color:#c26a3d;font-size:8px;letter-spacing:.05em}.g span.t{background:#c26a3d;color:#fff;border-radius:50%;font-weight:700}
.g span{line-height:20px}
h1{font:700 clamp(38px,11vw,54px)/1.08 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0 0 26px;letter-spacing:-.01em}
.get{display:block;width:100%;padding:20px;border-radius:14px;background:var(--ac);color:#fff;text-decoration:none;font-size:19px;font-weight:600;letter-spacing:.18em;box-shadow:0 6px 16px rgba(120,60,20,.28)}
.get:hover{background:var(--ac2)}
.cont{display:inline-block;margin-top:20px;color:var(--tx);text-decoration:none;font-size:18px}.cont b{font-size:22px;font-weight:500}
.hint{color:var(--mu);font-size:13px;margin:22px 0 0}.hint a{color:var(--ac)}
</style></head><body><div class="pg">
<a class="logo" href="./"><img src="icons/icon-192.png" alt="">Kalendar</a>
<div class="ph"><div class="sc">
<div class="art"><svg viewBox="0 0 230 170" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c7a1"/><stop offset="1" stop-color="#8a97bd"/></linearGradient></defs>
<rect width="230" height="170" fill="url(#s)"/><circle cx="160" cy="52" r="18" fill="#fff" opacity=".55"/>
<path d="M0 170V105l30-30 24 22 36-44 40 46 30-24 40 36 30-20v79z" fill="#5b6c91"/>
<path d="M0 170V128l36-26 30 20 38-30 44 36 36-24 46 22v44z" fill="#3f4d73"/>
<path d="M0 170v-22l40-22 50 24 60-30 80 28v22z" fill="#26324f"/></svg></div>
<div class="pn"><small id="yr"></small><b id="mo"></b><div class="g" id="gd"></div></div>
</div></div>
<h1>Kalendar App Now Available!</h1>
<a class="get apk" href="#">GET THE APP</a>
<a class="cont" id="web" href="./">Continue to <b>website</b></a>
<p class="hint">Free · works offline · no account. Version: <span class="ver">latest release</span><br>
Open the downloaded file and allow the install if Android asks. Prefer not to install? <a href="#" data-web>Use the web app</a>.</p>
</div>
<script>
(function(){
var M=["January","February","March","April","May","June","July","August","September","October","November","December"],T=new Date(),y=T.getFullYear(),m=T.getMonth();
document.getElementById("mo").textContent=M[m];document.getElementById("yr").textContent=String(y);
var g=document.getElementById("gd");["S","M","T","W","T","F","S"].forEach(function(s){var e=document.createElement("i");e.textContent=s;g.appendChild(e)});
var f=new Date(y,m,1).getDay(),dm=new Date(y,m+1,0).getDate();
for(var i=0;i<f+dm;i++){var s=document.createElement("span");if(i>=f){s.textContent=i-f+1;if(i-f+1==T.getDate())s.className="t"}g.appendChild(s)}
document.getElementById("web").onclick=function(){try{sessionStorage.setItem("kk-site","1")}catch(e){}};

})();
</script>
<script src="config.js"></script><script src="links.js"></script></body></html>
